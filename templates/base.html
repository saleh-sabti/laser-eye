<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laser Auto-Align{% block title %}{% endblock %}</title>
<style>
  :root {
    --bg: #f2ead7;
    --surface: #fbf7ec;
    --surface-2: #f2e9d3;
    --border: #ddd0ac;
    --text: #211c14;
    --text-muted: #7d7361;
    --accent: #c1440e;
    --accent-hover: #9c380b;
    --accent-soft: #f5ddc9;
    --target: #1f8a4c;
    --target-soft: #dcf1e3;
    --success-bg: #dcf1e3;
    --success-text: #1f8a4c;
    --danger-bg: #fbe2df;
    --danger-text: #b0301a;
    --warn-bg: #f7e6bd;
    --warn-text: #8a5a09;
    --radius: 6px;
    --radius-sm: 4px;
    --shadow: 0 1px 0 rgba(33,28,20,0.05), inset 0 0 0 1px rgba(33,28,20,0.025);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --surface: #1d2023;
      --surface-2: #25282c;
      --border: #34373c;
      --text: #ece6d8;
      --text-muted: #9a9385;
      --accent: #ff6a2e;
      --accent-hover: #ff8752;
      --accent-soft: #3a2415;
      --target: #3ddc7a;
      --target-soft: #123322;
      --success-bg: #123322;
      --success-text: #3ddc7a;
      --danger-bg: #3a1414;
      --danger-text: #f87171;
      --warn-bg: #3a2c0a;
      --warn-text: #fbbf24;
      --shadow: 0 1px 0 rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.035);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      linear-gradient(color-mix(in srgb, var(--text) 5%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--text) 5%, transparent) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--text);
    font-family: var(--font-sans);
    line-height: 1.5;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }
  .shell { max-width: 900px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }

  header.app-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 1rem 0 0.5rem;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-weight: 800;
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .brand .dot { font-size: 1.2rem; }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  nav.tabs {
    display: flex;
    gap: 0;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    margin: 0.5rem 0 1.75rem;
  }
  nav.tabs a {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    text-decoration: none;
    color: var(--text-muted);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 0.6rem 0.85rem;
    font-size: 0.76rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  nav.tabs a:hover { color: var(--text); }
  nav.tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }

  .flash {
    background: var(--warn-bg);
    color: var(--warn-text);
    border: 1px solid color-mix(in srgb, var(--warn-text) 25%, transparent);
    padding: 0.65rem 1rem;
    border-radius: var(--radius-sm);
    margin-bottom: 1rem;
    font-size: 0.92rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem 1.4rem;
    margin-bottom: 1.25rem;
  }
  .card h2 {
    margin: 0 0 0.9rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card > p:first-of-type { color: var(--text-muted); margin-top: -0.25rem; }
  h1 {
    font-size: 1.3rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 800;
    margin: 0.3rem 0 1rem;
  }

  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--border); }
  th {
    color: var(--text-muted);
    font-weight: 700;
    width: 40%;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
  }
  td { font-variant-numeric: tabular-nums; }
  tr:last-child td, tr:last-child th { border-bottom: none; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge.ok { background: var(--success-bg); color: var(--success-text); }
  .badge.bad { background: var(--danger-bg); color: var(--danger-text); }
  .badge::before { content: "\25CF"; font-size: 0.55rem; }

  label { display: block; margin-top: 0.9rem; font-weight: 700; font-size: 0.82rem; }
  input[type=number], input[type=text], input[type=file], select {
    display: block;
    width: 100%;
    max-width: 320px;
    margin-top: 0.35rem;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.92rem;
  }
  input[type=number] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=file] { max-width: 100%; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 1rem;
    padding: 0.55rem 1.1rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff9f2; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff9f2; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }

  img.frame {
    max-width: 100%;
    display: block;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
  }
  .viewfinder {
    position: relative;
    display: inline-block;
    max-width: 100%;
  }
  .viewfinder::before {
    content: "";
    position: absolute;
    inset: -10px;
    pointer-events: none;
    background:
      linear-gradient(var(--accent), var(--accent)) top    left  / 18px 2px no-repeat,
      linear-gradient(var(--accent), var(--accent)) top    left  / 2px 18px no-repeat,
      linear-gradient(var(--accent), var(--accent)) top    right / 18px 2px no-repeat,
      linear-gradient(var(--accent), var(--accent)) top    right / 2px 18px no-repeat,
      linear-gradient(var(--accent), var(--accent)) bottom left  / 18px 2px no-repeat,
      linear-gradient(var(--accent), var(--accent)) bottom left  / 2px 18px no-repeat,
      linear-gradient(var(--accent), var(--accent)) bottom right / 18px 2px no-repeat,
      linear-gradient(var(--accent), var(--accent)) bottom right / 2px 18px no-repeat;
  }
  .viewfinder img.frame { max-width: 100%; }

  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--target);
    box-shadow: 0 0 0 3px var(--target-soft);
    animation: live-pulse 1.6s ease-in-out infinite;
  }
  @keyframes live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }

  .hint { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.35rem; }
  .pixel-readout { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
  code, .mono { font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand"><span class="dot">🔦</span> Laser Auto-Align</div>
      <span class="brand-sub">Camera-guided alignment</span>
    </header>
    <nav class="tabs">
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">🏠 Dashboard</a>
      <a href="{{ url_for('settings_page') }}" class="{{ 'active' if request.endpoint == 'settings_page' }}">⚙️ Settings</a>
      <a href="{{ url_for('calibration_page') }}" class="{{ 'active' if request.endpoint == 'calibration_page' }}">🎯 Calibration</a>
      <a href="{{ url_for('live_page') }}" class="{{ 'active' if request.endpoint == 'live_page' }}">📷 Live View</a>
      <a href="{{ url_for('design_page') }}" class="{{ 'active' if request.endpoint == 'design_page' }}">🎨 Design & Export</a>
      <a href="{{ url_for('training_page') }}" class="{{ 'active' if request.endpoint == 'training_page' }}">🧪 Training Data</a>
    </nav>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
