<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laser Auto-Align{% block title %}{% endblock %}</title>
<style>
  :root {
    --bg: #f2f3f7;
    --surface: #ffffff;
    --surface-2: #f8f9fb;
    --border: #e3e5eb;
    --text: #16181d;
    --text-muted: #6b7280;
    --primary: #2f6fed;
    --primary-hover: #2557c7;
    --primary-soft: #eaf0fe;
    --success-bg: #e2f8ea;
    --success-text: #15803d;
    --danger-bg: #fde8e8;
    --danger-text: #b91c1c;
    --warn-bg: #fef3c7;
    --warn-text: #92400e;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(20,20,30,0.04), 0 4px 16px rgba(20,20,30,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #181b21;
      --surface-2: #1f232b;
      --border: #2a2e37;
      --text: #e7e9ee;
      --text-muted: #9aa1ac;
      --primary: #5b8def;
      --primary-hover: #7ba1f2;
      --primary-soft: #1b2740;
      --success-bg: #10321f;
      --success-text: #4ade80;
      --danger-bg: #3a1414;
      --danger-text: #f87171;
      --warn-bg: #3a2c0a;
      --warn-text: #fbbf24;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .shell { max-width: 900px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }

  header.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 1rem 0 0.5rem;
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 1.15rem; }
  .brand .dot { font-size: 1.3rem; }

  nav.tabs {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    margin: 0.5rem 0 1.5rem;
  }
  nav.tabs a {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    text-decoration: none;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0.45rem 0.85rem;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 500;
    transition: all 0.15s ease;
  }
  nav.tabs a:hover { color: var(--text); border-color: var(--primary); }
  nav.tabs a.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  .flash {
    background: var(--warn-bg);
    color: var(--warn-text);
    border: 1px solid color-mix(in srgb, var(--warn-text) 25%, transparent);
    padding: 0.65rem 1rem;
    border-radius: var(--radius-sm);
    margin-bottom: 1rem;
    font-size: 0.92rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem 1.4rem;
    margin-bottom: 1.25rem;
  }
  .card h2 {
    margin-top: 0;
    font-size: 1.02rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card > p:first-of-type { color: var(--text-muted); margin-top: -0.25rem; }
  h1 { font-size: 1.5rem; margin: 0.2rem 0 0.9rem; }

  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; width: 40%; }
  tr:last-child td, tr:last-child th { border-bottom: none; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .badge.ok { background: var(--success-bg); color: var(--success-text); }
  .badge.bad { background: var(--danger-bg); color: var(--danger-text); }
  .badge::before { content: "\25CF"; font-size: 0.55rem; }

  label { display: block; margin-top: 0.9rem; font-weight: 600; font-size: 0.88rem; }
  input[type=number], input[type=text], input[type=file], select {
    display: block;
    width: 100%;
    max-width: 320px;
    margin-top: 0.35rem;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.92rem;
  }
  input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  input[type=file] { max-width: 100%; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 1rem;
    padding: 0.55rem 1.1rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { border-color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: white; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }

  img.frame {
    max-width: 100%;
    display: block;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
  }
  .hint { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.35rem; }
  .pixel-readout { font-weight: 600; }
</style>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand"><span class="dot">🔦</span> Laser Auto-Align</div>
    </header>
    <nav class="tabs">
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">🏠 Dashboard</a>
      <a href="{{ url_for('settings_page') }}" class="{{ 'active' if request.endpoint == 'settings_page' }}">⚙️ Settings</a>
      <a href="{{ url_for('calibration_page') }}" class="{{ 'active' if request.endpoint == 'calibration_page' }}">🎯 Calibration</a>
      <a href="{{ url_for('live_page') }}" class="{{ 'active' if request.endpoint == 'live_page' }}">📷 Live View</a>
      <a href="{{ url_for('design_page') }}" class="{{ 'active' if request.endpoint == 'design_page' }}">🎨 Design & Export</a>
      <a href="{{ url_for('training_page') }}" class="{{ 'active' if request.endpoint == 'training_page' }}">🧪 Training Data</a>
    </nav>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
