<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laser Auto-Align{% block title %}{% endblock %}</title>
<style>
  @font-face {
    font-family: "Fraunces";
    font-style: normal;
    font-weight: 500 800;
    font-display: swap;
    src: url("{{ url_for('static', filename='fonts/fraunces-normal.woff2') }}") format("woff2");
  }
  @font-face {
    font-family: "Fraunces";
    font-style: italic;
    font-weight: 500 800;
    font-display: swap;
    src: url("{{ url_for('static', filename='fonts/fraunces-italic.woff2') }}") format("woff2");
  }
  @font-face {
    font-family: "Work Sans";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("{{ url_for('static', filename='fonts/worksans-normal.woff2') }}") format("woff2");
  }
  @font-face {
    font-family: "Work Sans";
    font-style: italic;
    font-weight: 500;
    font-display: swap;
    src: url("{{ url_for('static', filename='fonts/worksans-italic.woff2') }}") format("woff2");
  }
  :root {
    --bg: #e8e1d0;
    --surface: #f6f1e4;
    --surface-2: #eee6d3;
    --border: #d3c6a8;
    --text: #2b2620;
    --text-muted: #756b58;
    --accent: #a8562a;
    --accent-hover: #8a4520;
    --accent-soft: #f0ddc7;
    --accent-2: #4c7a6e;
    --target: #3d7a52;
    --target-soft: #dcecdf;
    --success-bg: #dcecdf;
    --success-text: #2f6b45;
    --danger-bg: #f6ddd6;
    --danger-text: #a3401e;
    --warn-bg: #f3e3bd;
    --warn-text: #7a5309;
    --radius: 5px;
    --radius-sm: 3px;
    --shadow: 0 1px 0 rgba(30,24,14,0.05), inset 0 0 0 1px rgba(30,24,14,0.025);
    --font-display: "Fraunces", Georgia, "Iowan Old Style", serif;
    --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1d1c;
      --surface: #232624;
      --surface-2: #2b2e2b;
      --border: #3c3f3b;
      --text: #ece5d3;
      --text-muted: #9b9686;
      --accent: #d97b3f;
      --accent-hover: #ef9256;
      --accent-soft: #3a2415;
      --accent-2: #6fae9c;
      --target: #5fbf82;
      --target-soft: #16302a;
      --success-bg: #16302a;
      --success-text: #5fbf82;
      --danger-bg: #3a1c14;
      --danger-text: #f2896a;
      --warn-bg: #362a10;
      --warn-text: #e0b34f;
      --shadow: 0 1px 0 rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.035);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: repeating-linear-gradient(
      45deg,
      color-mix(in srgb, var(--text) 5%, transparent) 0px,
      color-mix(in srgb, var(--text) 5%, transparent) 1px,
      transparent 1px,
      transparent 9px
    );
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }
  .shell { max-width: 900px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }

  header.app-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 1rem 0 0.5rem;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.35rem;
  }
  .brand .dot { font-size: 1.2rem; }
  .brand-sub {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  nav.tabs {
    display: flex;
    gap: 0;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    margin: 0.5rem 0 1.75rem;
  }
  nav.tabs a {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    text-decoration: none;
    color: var(--text-muted);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 0.6rem 0.85rem;
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 500;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  nav.tabs a:hover { color: var(--text); }
  nav.tabs a.active {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .flash {
    background: var(--warn-bg);
    color: var(--warn-text);
    border: 1px solid color-mix(in srgb, var(--warn-text) 25%, transparent);
    padding: 0.65rem 1rem;
    border-radius: var(--radius-sm);
    margin-bottom: 1rem;
    font-size: 0.92rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.3rem 1.4rem;
    margin-bottom: 1.25rem;
  }
  .card h2 {
    margin: 0 0 0.9rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card > p:first-of-type { color: var(--text-muted); margin-top: -0.25rem; }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.9rem;
    margin: 0.3rem 0 1.1rem;
  }

  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--border); }
  th {
    color: var(--text-muted);
    font-weight: 600;
    width: 40%;
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
  }
  td { font-variant-numeric: tabular-nums; }
  tr:last-child td, tr:last-child th { border-bottom: none; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge.ok { background: var(--success-bg); color: var(--success-text); }
  .badge.bad { background: var(--danger-bg); color: var(--danger-text); }
  .badge::before { content: "\25CF"; font-size: 0.55rem; }

  label { display: block; margin-top: 0.9rem; font-weight: 600; font-size: 0.85rem; }
  input[type=number], input[type=text], input[type=file], select {
    display: block;
    width: 100%;
    max-width: 320px;
    margin-top: 0.35rem;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.92rem;
  }
  input[type=number] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=file] { max-width: 100%; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 1rem;
    padding: 0.55rem 1.1rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fdf8f0; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fdf8f0; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }

  img.frame {
    max-width: 100%;
    display: block;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
  }
  .viewfinder {
    position: relative;
    display: inline-block;
    max-width: 100%;
  }
  .viewfinder::before {
    content: "";
    position: absolute;
    inset: -10px;
    pointer-events: none;
    background:
      linear-gradient(var(--accent), var(--accent)) top    left  / 18px 2px no-repeat,
      linear-gradient(var(--accent), var(--accent)) top    left  / 2px 18px no-repeat,
      linear-gradient(var(--accent), var(--accent)) top    right / 18px 2px no-repeat,
      linear-gradient(var(--accent), var(--accent)) top    right / 2px 18px no-repeat,
      linear-gradient(var(--accent), var(--accent)) bottom left  / 18px 2px no-repeat,
      linear-gradient(var(--accent), var(--accent)) bottom left  / 2px 18px no-repeat,
      linear-gradient(var(--accent), var(--accent)) bottom right / 18px 2px no-repeat,
      linear-gradient(var(--accent), var(--accent)) bottom right / 2px 18px no-repeat;
  }
  .viewfinder img.frame { max-width: 100%; }

  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--target);
    box-shadow: 0 0 0 3px var(--target-soft);
    animation: live-pulse 1.6s ease-in-out infinite;
  }
  @keyframes live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }

  .hint { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.35rem; }
  .pixel-readout { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
  code, .mono { font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand"><span class="dot">🔦</span> Laser Auto-Align</div>
      <span class="brand-sub">camera-guided alignment</span>
    </header>
    <nav class="tabs">
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">🏠 Dashboard</a>
      <a href="{{ url_for('settings_page') }}" class="{{ 'active' if request.endpoint == 'settings_page' }}">⚙️ Settings</a>
      <a href="{{ url_for('calibration_page') }}" class="{{ 'active' if request.endpoint == 'calibration_page' }}">🎯 Calibration</a>
      <a href="{{ url_for('live_page') }}" class="{{ 'active' if request.endpoint == 'live_page' }}">📷 Live View</a>
      <a href="{{ url_for('design_page') }}" class="{{ 'active' if request.endpoint == 'design_page' }}">🎨 Design & Export</a>
      <a href="{{ url_for('training_page') }}" class="{{ 'active' if request.endpoint == 'training_page' }}">🧪 Training Data</a>
    </nav>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
